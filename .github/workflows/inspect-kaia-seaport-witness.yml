name: Inspect Kaia Seaport witness

on:
  push:
    branches:
      - research/kaia-source-export-20260908
    paths:
      - research/INSPECT_KAIA_SEAPORT_WITNESS
      - .github/workflows/inspect-kaia-seaport-witness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Query pinned read-only mainnet state
        shell: bash
        env:
          BLOCK_HEX: "0x9c0e2ed"
          ARCHIVE_RPC: "https://archive-en.node.kaia.io"
        run: |
          set -u
          mkdir -p output/accounts

          rpc() {
            local method="$1"
            local params="$2"
            curl --retry 4 --max-time 60 -sS \
              -H 'content-type: application/json' \
              --data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$method\",\"params\":$params}" \
              "$ARCHIVE_RPC"
          }

          cat > output/offerers.txt <<'EOF'
          0x6144fc11a29cef4735ce0a5f31ad7aeb674cd836
          0x9fe9b38d33f453bec557adb312e4d1fd889e2da3
          0x07113eac6c50b84cc550ab7ee754253ee6f4d3cc
          0x800d156a98a677e44d565711fb1e64e5de248108
          0x4a11939502c2aadce1ee8a495e5a85177a3f7301
          EOF
          sed -i 's/^[[:space:]]*//' output/offerers.txt

          BLOCK_DEC=$((BLOCK_HEX))
          PREV_HEX=$(printf '0x%x' "$((BLOCK_DEC - 1))")
          echo "block_hex=$BLOCK_HEX" > output/summary.txt
          echo "block_dec=$BLOCK_DEC" >> output/summary.txt

          while read -r OFFERER; do
            [ -n "$OFFERER" ] || continue
            NAME=${OFFERER,,}
            rpc kaia_getAccount "[\"$OFFERER\",\"$BLOCK_HEX\"]" > "output/accounts/${NAME}-account-at-fill.json"
            rpc kaia_getAccount "[\"$OFFERER\",\"$PREV_HEX\"]" > "output/accounts/${NAME}-account-before-fill.json"
            rpc kaia_getAccount "[\"$OFFERER\",\"latest\"]" > "output/accounts/${NAME}-account-latest.json"
            rpc klay_getAccountKey "[\"$OFFERER\",\"$BLOCK_HEX\"]" > "output/accounts/${NAME}-key-at-fill.json"
            rpc klay_getAccountKey "[\"$OFFERER\",\"latest\"]" > "output/accounts/${NAME}-key-latest.json"
            rpc eth_getCode "[\"$OFFERER\",\"$BLOCK_HEX\"]" > "output/accounts/${NAME}-code-at-fill.json"
            rpc eth_getCode "[\"$OFFERER\",\"latest\"]" > "output/accounts/${NAME}-code-latest.json"
            rpc eth_getBalance "[\"$OFFERER\",\"$BLOCK_HEX\"]" > "output/accounts/${NAME}-balance-at-fill.json"
            rpc eth_getBalance "[\"$OFFERER\",\"latest\"]" > "output/accounts/${NAME}-balance-latest.json"
            rpc eth_getTransactionCount "[\"$OFFERER\",\"$BLOCK_HEX\"]" > "output/accounts/${NAME}-nonce-at-fill.json"
            rpc eth_getTransactionCount "[\"$OFFERER\",\"latest\"]" > "output/accounts/${NAME}-nonce-latest.json"
          done < output/offerers.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for path in sorted(Path('output/accounts').glob('*-account-at-fill.json')):
              addr=path.name.removesuffix('-account-at-fill.json')
              def load(suffix):
                  p=Path('output/accounts')/f'{addr}-{suffix}.json'
                  try:
                      obj=json.loads(p.read_text())
                      return obj.get('result', {'rpc_error': obj.get('error')})
                  except Exception as e:
                      return {'parse_error':str(e)}
              at=load('account-at-fill')
              latest=load('account-latest')
              key=load('key-at-fill')
              latest_key=load('key-latest')
              code=load('code-at-fill')
              latest_code=load('code-latest')
              rows.append({
                  'address':addr,
                  'account_at_fill':at,
                  'account_latest':latest,
                  'key_at_fill':key,
                  'key_latest':latest_key,
                  'code_length_at_fill': None if not isinstance(code,str) else max(0,(len(code)-2)//2),
                  'code_length_latest': None if not isinstance(latest_code,str) else max(0,(len(latest_code)-2)//2),
                  'nonce_at_fill':load('nonce-at-fill'),
                  'nonce_latest':load('nonce-latest'),
                  'balance_at_fill':load('balance-at-fill'),
                  'balance_latest':load('balance-latest'),
              })
          Path('output/offerer-matrix.json').write_text(json.dumps(rows,indent=2))
          with Path('output/matrix.txt').open('w') as f:
              for row in rows:
                  at=row['account_at_fill'] if isinstance(row['account_at_fill'],dict) else {}
                  key=row['key_at_fill'] if isinstance(row['key_at_fill'],dict) else {}
                  line=(f"{row['address']} accType={at.get('accType')} "
                        f"keyType={key.get('keyType')} code={row['code_length_at_fill']} "
                        f"nonce={row['nonce_at_fill']}")
                  print(line)
                  f.write(line+'\n')
          PY

          for f in output/*.json output/accounts/*.json; do
            [ -f "$f" ] && jq . "$f" > "$f.pretty" 2>/dev/null || true
          done
          find output -type f -print0 | sort -z | xargs -0 sha256sum > output/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaia-seaport-offerer-inspection-${{ github.run_id }}
          path: output
          if-no-files-found: error
